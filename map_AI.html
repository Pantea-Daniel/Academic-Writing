<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map AI</title>
  <link rel="stylesheet" href="map_AI.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050814;
      font-family: 'Inria Serif', serif;
    }
    .background {
      position: relative;
    }
    .title,
    .artificial-intelligence,
    .math-box,
    .software-box,
    .ai-box,
    .physics-box,
    .physics {
      padding: 0 8px;
      justify-content: center;
    }
    .left-bottom { top: 480px; left: 20px; }
    .right-bottom { top: 480px; left: 620px; }
    .top-right-panel { top: 20px; left: 620px; }
    .separator-line { top: 420px; left: 20px; }
    .connections { top: 40px; left: 40px; }
    .shield { top: 120px; left: 320px; }
    .artificial-intelligence { top: 320px; left: 300px; }
    .connections-boxes-icons { top: 440px; left: 40px; border: 1px dashed rgba(255,255,255,0.15); }
    .down-arrow { top: 520px; left: 220px; }
    .up-arrow { top: 520px; left: 320px; }
    .math-box { top: 620px; left: 40px; }
    .software-box { top: 620px; left: 200px; }
    .ai-box { top: 620px; left: 360px; }
    .physics-box { top: 620px; left: 520px; }
    .physics { top: 658px; left: 560px; }
  </style>
</head>
<body>
  <div class="background">
    <div class="left-bottom"></div>
    <div class="right-bottom"></div>
    <div class="top-right-panel"></div>
    <div class="separator-line"></div>
    <div class="connections title">Connections</div>
    <div class="shield"></div>
    <div class="artificial-intelligence">Artificial Intelligence</div>
    <div class="connections-boxes-icons"></div>
    <div class="down-arrow"></div>
    <div class="up-arrow"></div>
    <div class="math-box">Math</div>
    <div class="software-box">Software</div>
    <div class="ai-box">AI</div>
    <div class="physics-box">Physics</div>
    <div class="physics">Physics</div>
  </div>
</body>
</html>
